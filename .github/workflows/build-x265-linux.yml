name: Build x265 (Linux)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake nasm

      - name: CMake configure
        run: |
          mkdir -p build-linux
          cd build-linux
          cmake ../source \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SHARED=ON \
            -DENABLE_CLI=OFF

      - name: Build
        run: |
          cd build-linux
          make -j$(nproc)

      - name: List shared lib
        run: ls -la build-linux/libx265* || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libx265-linux
          path: |
            build-linux/libx265.so
            build-linux/libx265.so.*
